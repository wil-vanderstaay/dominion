<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Deck Draw</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
        radial-gradient(circle at top,#243b64,#101828 55%);
    color:white;
}

.container{
    width:min(90vw,420px);
    text-align:center;
}

h1{
    font-size:2.5rem;
    margin:0 0 45px;
    font-weight:800;
    letter-spacing:-1px;
}

.result-card{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(12px);
    border-radius:28px;
    padding:35px 20px;
    margin-bottom:30px;
    min-height:170px;
    display:flex;
    align-items:center;
    justify-content:center;
}

#result{
    font-size:2rem;
    line-height:1.5;
    font-weight:700;
}

#result span{
    color:#60a5fa;
}

button{

    width:100%;
    padding:24px;

    border:none;
    border-radius:22px;

    background:#2563eb;
    color:white;

    font-size:1.5rem;
    font-weight:750;

    cursor:pointer;

    box-shadow:
        0 10px 25px rgba(37,99,235,.35);

    transition:.15s;
}

button:active{
    transform:scale(.96);
}


.footer{

    margin-top:35px;

    color:#94a3b8;

    font-size:.95rem;

    line-height:1.5;

}

</style>

</head>


<body>


<div class="container">


<h1>Deck Draw</h1>


<div class="result-card">

<div id="result">
Ready to draw
</div>

</div>


<button onclick="drawCards()">
🎲 Draw 10 Cards
</button>


<div class="footer">
52 cards total<br>
26 from Deck A · 26 from Deck B
</div>


</div>



<script>


function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=[array[j],array[i]];
    }

    return array;
}



function drawCards(){

    const deck=[];


    for(let i=0;i<26;i++)
        deck.push("A");


    for(let i=0;i<26;i++)
        deck.push("B");


    shuffle(deck);


    const draw=deck.slice(0,10);


    let a=0;
    let b=0;


    draw.forEach(card=>{

        if(card==="A")
            a++;
        else
            b++;

    });


    document.getElementById("result").innerHTML=
    `
    Deck A <span>${a}</span><br>
    Deck B <span>${b}</span>
    `;


    if(navigator.vibrate){
        navigator.vibrate(40);
    }

}


</script>


</body>
</html>
