<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dominion Dealer</title>
	<style>
		* {
			box-sizing: border-box;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background: radial-gradient(circle at top, #243b64, #101828 55%);
			color: #fff;
		}

		.container {
			width: min(92vw, 430px);
			padding: 20px;
		}

		h1 {
			text-align: center;
			font-size: 2.3rem;
			margin: 0 0 20px;
		}

		.card {
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.12);
			backdrop-filter: blur(10px);
			border-radius: 22px;
			padding: 18px;
			margin-bottom: 20px;
		}

		.expansion-header {
			display: flex;
			justify-content: space-between;
			font-weight: 700;
			cursor: pointer;
		}

		.expansion-list {
			display: flex;
			flex-direction: column;
			gap: 10px;
			margin-top: 14px;
		}

		.expansion {
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.expansion input {
			width: 22px;
			height: 22px;
			cursor: pointer;
		}

		.more-btn {
			background: transparent;
			border: 1px dashed rgba(255, 255, 255, 0.3);
			color: #9ca3af;
			padding: 8px 12px;
			border-radius: 12px;
			cursor: pointer;
			font-size: 0.9rem;
			font-weight: 600;
			margin-top: 10px;
			width: 100%;
			transition: all 0.2s;
		}

		.more-btn:hover {
			background: rgba(255, 255, 255, 0.05);
			color: #fff;
			border-color: rgba(255, 255, 255, 0.5);
		}

		.draw-btn {
			flex: 1;
			padding: 10px;
			border: none;
			border-radius: 20px;
			color: #fff;
			font-size: 1.05rem;
			font-weight: 700;
			cursor: pointer;
			margin-bottom: 20px;
			transition: transform 0.15s;
		}

		.draw-btn:active {
			transform: scale(0.96);
		}

		.draw-btn.primary {
			background: #2563eb;
		}

		.draw-btn.secondary {
			background: linear-gradient(135deg, #7c3aed, #db2777);
		}

		.draw-row {
			display: flex;
			gap: 12px;
		}

		#result {
			text-align: center;
			font-size: 1.2rem;
			line-height: 1.8;
		}

		#result span {
			color: #60a5fa;
			font-weight: 700;
		}

		.footer {
			text-align: center;
			color: #9ca3af;
		}

		.hidden {
			display: none !important;
		}
	</style>
</head>

<body>

	<div class="container">
		<h1>Dominion Dealer</h1>

		<div class="card">
			<div class="expansion-header" onclick="toggleAccordion()">
				<span>Expansions</span>
				<span id="expandIcon">▼</span>
			</div>

			<div id="expansionWrapper" class="">
				<div id="ownedList" class="expansion-list"></div>
				<button type="button" class="more-btn" id="moreBtn" onclick="toggleMoreExpansions()">More Expansions ▼</button>
				<div id="moreList" class="expansion-list hidden"></div>
			</div>
		</div>

		<div class="draw-row">
			<button class="draw-btn primary" onclick="drawCards()">🎲 Draw 10 Cards</button>
			<button class="draw-btn secondary" onclick="drawWithRandomMix()">🎰 Random Expansion Mix</button>
		</div>

		<div class="card">
			<div id="result"></div>
		</div>

		<div class="footer" id="footer"></div>
	</div>

	<script>
		const expansions = [
			{ name: "Base", cards: 26, enabled: true },
			{ name: "Prosperity", cards: 25, enabled: false },
			{ name: "Hinterlands", cards: 26, enabled: false },
			{ name: "Intrigue", cards: 26, enabled: false },
			{ name: "Renaissance", cards: 25, enabled: false },
			{ name: "Seaside", cards: 27, enabled: false },
			{ name: "Alchemy", cards: 12, enabled: false },
			{ name: "Cornucopia", cards: 13, enabled: false },
			{ name: "Dark Ages", cards: 35, enabled: false },
			{ name: "Guilds", cards: 13, enabled: false },
			{ name: "Adventures", cards: 30, enabled: false },
			{ name: "Empires", cards: 24, enabled: false },
			{ name: "Nocturne", cards: 33, enabled: false },
			{ name: "Menagerie", cards: 30, enabled: false },
			{ name: "Allies", cards: 31, enabled: false },
			{ name: "Plunder", cards: 40, enabled: false },
			{ name: "Rising Sun", cards: 25, enabled: false }
		];

		function buildList(items, containerEl) {
			containerEl.innerHTML = items.map(exp => `
				<label class="expansion">
					<span>${exp.name} (${exp.cards})</span>
					<input type="checkbox" ${exp.enabled ? 'checked' : ''} onchange="toggleExpansion('${exp.name}', this.checked)">
				</label>
			`).join('');
		}

		function render() {
			buildList(expansions.slice(0, 5), document.getElementById('ownedList'));
			buildList(expansions.slice(5), document.getElementById('moreList'));
			updateSummary();
		}

		function toggleExpansion(name, isChecked) {
			const exp = expansions.find(e => e.name === name);
			if (exp) exp.enabled = isChecked;
			updateSummary();
		}

		function toggleAccordion() {
			const wrapper = document.getElementById('expansionWrapper');
			const icon = document.getElementById('expandIcon');

			wrapper.classList.toggle('hidden');
			icon.textContent = wrapper.classList.contains('hidden') ? '▼' : '▲';
		}

		function toggleMoreExpansions() {
			const moreList = document.getElementById('moreList');
			const moreBtn = document.getElementById('moreBtn');

			const isHidden = moreList.classList.toggle('hidden');
			moreBtn.textContent = isHidden ? 'More Expansions ▼' : 'Show Less ▲';
		}

		function updateSummary() {
			const activeExpansions = expansions.filter(e => e.enabled);
			const totalCards = activeExpansions.reduce((sum, e) => sum + e.cards, 0);

			document.getElementById('footer').textContent = `${totalCards} randomizer cards selected`;

			const resultEl = document.getElementById('result');
			if (activeExpansions.length === 0) {
				resultEl.innerHTML = "No expansions selected";
				return;
			}

			resultEl.innerHTML = activeExpansions
				.map(e => `${e.name}: <span>?</span>`)
				.join('<br>');
		}

		function performDraw(activeExpansions) {
			const pool = [];
			activeExpansions.forEach(e => {
				if (e.enabled) {
					for (let i = 0; i < e.cards; i++) {
						pool.push(e.name);
					}
				}
			});

			if (pool.length < 10) {
				document.getElementById('result').textContent = "Select more expansions.";
				return;
			}

			for (let i = pool.length - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				[pool[i], pool[j]] = [pool[j], pool[i]];
			}

			const drawn = pool.slice(0, 10);
			const counts = {};
			drawn.forEach(name => counts[name] = (counts[name] || 0) + 1);

			const prosperityActive = activeExpansions.some(e => e.name === 'Prosperity');
			let includePlatColony = false;
			
			if (prosperityActive) {
				const randomPick = drawn[Math.floor(Math.random() * drawn.length)];
				includePlatColony = (randomPick === 'Prosperity');
			}

			let html = activeExpansions
				.map(e => `${e.name}: <span>${counts[e.name] || 0}</span>`)
				.join('<br>');

			if (prosperityActive) {
				html += `<br>Platinum/Colony: <span>${includePlatColony ? 'Yes' : 'No'}</span>`;
			}

			document.getElementById('result').innerHTML = html;
		}

		function drawCards() {
			const selected = expansions.filter(e => e.enabled);
			performDraw(selected);
		}

		function drawWithRandomMix() {
			const owned = expansions.filter(e => e.enabled);

			let chosen = [];
			while (chosen.length == 0) {
				chosen = owned.filter(() => Math.random() < 0.5);
			}
			performDraw(chosen);
		}

		// Initialize UI
		render();
	</script>
</body>

</html>
