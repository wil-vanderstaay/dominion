<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Deck Draw</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#101828;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:min(92vw,420px);
    text-align:center;
}

h1{
    font-size:2.3rem;
    margin-bottom:35px;
    font-weight:700;
}

button{
    width:100%;
    padding:28px;
    font-size:2rem;
    font-weight:bold;
    border:none;
    border-radius:22px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    transition:.15s;
}

button:active{
    transform:scale(.97);
}

#result{
    margin-top:40px;
    font-size:2rem;
    line-height:1.7;
    font-weight:700;
}

.small{
    margin-top:35px;
    color:#94a3b8;
    font-size:1rem;
}

.history{
    margin-top:18px;
    text-align:left;
    background:#1e293b;
    border-radius:14px;
    padding:14px;
    max-height:220px;
    overflow-y:auto;
}

.history h3{
    margin-top:0;
    text-align:center;
    font-size:1rem;
}

.history div{
    padding:6px 0;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.history div:last-child{
    border-bottom:none;
}
</style>

</head>

<body>

<div class="container">

<h1>Deck Draw</h1>

<button onclick="drawCards()">
🎲 Draw 10 Cards
</button>

<div id="result">
Press the button
</div>

<div class="history">
<h3>Recent Draws</h3>
<div id="history"></div>
</div>

<div class="small">
52 cards total<br>
26 from Deck A • 26 from Deck B
</div>

</div>

<script>

const history=[];

function shuffle(array){

    for(let i=array.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [array[i],array[j]]=[array[j],array[i]];
    }

    return array;
}

function drawCards(){

    const deck=[];

    for(let i=0;i<26;i++) deck.push("A");
    for(let i=0;i<26;i++) deck.push("B");

    shuffle(deck);

    const draw=deck.slice(0,10);

    let a=0;
    let b=0;

    draw.forEach(card=>{
        if(card==="A") a++;
        else b++;
    });

    document.getElementById("result").innerHTML=
    `
    Deck A: <strong>${a}</strong><br>
    Deck B: <strong>${b}</strong>
    `;

    if(navigator.vibrate){
        navigator.vibrate(40);
    }

    history.unshift(`Deck A ${a} • Deck B ${b}`);

    if(history.length>10)
        history.pop();

    document.getElementById("history").innerHTML=
        history.map(x=>`<div>${x}</div>`).join("");
}

</script>

</body>
</html>
